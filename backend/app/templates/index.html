<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meter Buddy Dumps</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 2rem;
        color: #1f2933;
        background: #f7f9fb;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid #d9e2ec;
      }

      th,
      td {
        padding: 0.7rem;
        border-bottom: 1px solid #d9e2ec;
        text-align: left;
        font-size: 0.95rem;
      }

      th {
        background: #eef2f6;
      }

      .empty {
        padding: 1rem;
        background: white;
        border: 1px solid #d9e2ec;
      }

      .preview-btn {
        cursor: pointer;
        color: #1f6fb0;
        text-decoration: underline;
        background: none;
        border: none;
        font-size: 0.95rem;
        padding: 0;
      }

      .preview-btn:hover {
        color: #0e4a7a;
      }

      .delete-btn {
        cursor: pointer;
        color: #b83232;
        text-decoration: underline;
        background: none;
        border: none;
        font-size: 0.95rem;
        padding: 0;
      }

      .delete-btn:hover {
        color: #7f1d1d;
      }

      .delete-btn:disabled {
        cursor: not-allowed;
        color: #9aa5b1;
        text-decoration: none;
      }

      .cleanup-panel {
        margin: 1.5rem 0;
        padding: 1rem;
        background: white;
        border: 1px solid #d9e2ec;
      }

      .cleanup-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: end;
      }

      .cleanup-controls label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.85rem;
      }

      .cleanup-controls input {
        width: 7rem;
        padding: 0.45rem;
        border: 1px solid #bcccdc;
        border-radius: 4px;
      }

      .cleanup-controls button {
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        color: #b83232;
        border: 1px solid #e12d39;
        background: #fff5f5;
        border-radius: 4px;
      }

      .cleanup-controls button:hover {
        background: #ffe3e3;
      }

      #cleanup-status {
        min-height: 1.2rem;
        margin: 0.8rem 0 0;
        color: #52606d;
      }

      .preview-row pre {
        margin: 0;
        padding: 0.5rem;
        background: #f4f6f8;
        border: 1px solid #d9e2ec;
        border-radius: 4px;
        font-size: 0.8rem;
        max-height: 300px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }


      .plot-panel {
        margin: 1.5rem 0;
        padding: 1rem;
        background: white;
        border: 1px solid #d9e2ec;
      }

      .plot-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: end;
      }

      .plot-controls label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.85rem;
      }

      .plot-controls input {
        width: 7rem;
        padding: 0.45rem;
        border: 1px solid #bcccdc;
        border-radius: 4px;
      }

      .plot-controls button {
        padding: 0.5rem 0.8rem;
        cursor: pointer;
      }

      #plot-status {
        min-height: 1.2rem;
        margin: 0.8rem 0 0;
        color: #52606d;
      }

      #readings-plot {
        display: block;
        width: 100%;
        min-height: 500px;
        margin-top: 0.8rem;
        cursor: crosshair;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }

      .plot-telemetry {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        padding: 0.65rem 1rem;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.82rem;
        margin-top: 0.8rem;
        min-height: 2.4rem;
        align-items: center;
      }

      .telemetry-item {
        display: flex;
        align-items: center;
      }

      .telemetry-item .label {
        color: #94a3b8;
        margin-right: 0.35rem;
      }

      .telemetry-item .val {
        font-weight: 600;
        color: #38bdf8;
      }

      .preview-row {
        display: none;
      }

      .preview-row.visible {
        display: table-row;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meter Buddy Dumps</h1>

      <section class="plot-panel">
        <h2>Plot uploads</h2>
        <div class="plot-controls">
          <label>From upload ID <input id="plot-start-id" type="number" min="1"></label>
          <label>To upload ID <input id="plot-end-id" type="number" min="1"></label>
          <button id="plot-button" type="button">Plot range</button>
        </div>
        <p id="plot-status" role="status"></p>
        <div id="plot-telemetry" class="plot-telemetry" style="display: none;">
          <div class="telemetry-item"><span class="label">TIME:</span> <span id="telemetry-time" class="val">-</span></div>
          <div class="telemetry-item"><span class="label">PULSES:</span> <span id="telemetry-pulses" class="val">-</span></div>
          <div class="telemetry-item"><span class="label">EST POWER:</span> <span id="telemetry-power" class="val">-</span></div>
          <div class="telemetry-item"><span class="label">CUMULATIVE:</span> <span id="telemetry-kwh" class="val">-</span></div>
          <div class="telemetry-item"><span class="label">BATTERY:</span> <span id="telemetry-batt" class="val">-</span></div>
        </div>
        <canvas id="readings-plot" aria-label="Meter readings plot"></canvas>
      </section>

      <section class="cleanup-panel">
        <h2>Delete old uploads</h2>
        <div class="cleanup-controls">
          <label>Delete uploads up to ID <input id="delete-up-to-id" type="number" min="1"></label>
          <button id="delete-bulk-button" type="button">Delete range</button>
        </div>
        <p id="cleanup-status" role="status"></p>
      </section>
      <table id="dumps-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Device</th>
            <th>Received</th>
            <th>Readings</th>
            <th>Battery</th>
            <th>Download</th>
            <th>Preview</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="dumps-body">
        </tbody>
      </table>
      <p class="empty" id="empty-msg">No dumps stored yet.</p>
    </main>

    <script>
      function batteryCell(dump) {
        var html = "";
        if (dump.battery_v != null) {
          html += dump.battery_v.toFixed(2) + " V";
        } else {
          html += "n/a";
        }
        if (dump.battery_pct_est != null) {
          html += " (" + dump.battery_pct_est + "%)";
        }
        return html;
      }

      function buildRow(dump) {
        var row = document.createElement("tr");
        row.className = "dump-row";
        row.id = "dump-row-" + dump.id;
        row.innerHTML =
          "<td>" + dump.id + "</td>" +
          "<td>" + escapeHtml(dump.device_id) + "</td>" +
          "<td>" + escapeHtml(dump.received_at) + "</td>" +
          "<td>" + dump.reading_count + "</td>" +
          "<td>" + batteryCell(dump) + "</td>" +
          "<td><a href='/dumps/" + dump.id + ".json'>JSON</a></td>" +
          "<td><button class='preview-btn' data-dump-id='" + dump.id + "'>Preview</button></td>" +
          "<td><button class='delete-btn' data-dump-id='" + dump.id + "'>Delete</button></td>";
        return row;
      }

      function buildPreviewRow(dump) {
        var row = document.createElement("tr");
        row.className = "preview-row";
        row.id = "preview-row-" + dump.id;
        row.innerHTML = "<td colspan='8'><pre id='preview-content-" + dump.id + "'>Loading...</pre></td>";
        return row;
      }

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      function addDumpRow(dump, prepend) {
        var tbody = document.getElementById("dumps-body");
        var empty = document.getElementById("empty-msg");
        if (empty) empty.style.display = "none";

        var row = buildRow(dump);
        var previewRow = buildPreviewRow(dump);
        if (prepend) {
          tbody.insertBefore(row, tbody.firstChild);
          tbody.insertBefore(previewRow, tbody.firstChild.nextSibling || null);
        } else {
          tbody.appendChild(row);
          tbody.appendChild(previewRow);
        }
        attachPreview(row.querySelector(".preview-btn"));
        attachDelete(row.querySelector(".delete-btn"));
      }

      function removeDumpRows(dumpId) {
        var dumpRow = document.getElementById("dump-row-" + dumpId);
        var previewRow = document.getElementById("preview-row-" + dumpId);
        if (dumpRow) dumpRow.remove();
        if (previewRow) previewRow.remove();
        if (!document.querySelector(".dump-row")) {
          var empty = document.getElementById("empty-msg");
          if (empty) empty.style.display = "block";
        }
        updatePlotIdRange();
      }

      function attachDelete(btn) {
        btn.addEventListener("click", function () {
          var dumpId = this.dataset.dumpId;
          if (!window.confirm("Delete upload #" + dumpId + "? This cannot be undone.")) {
            return;
          }
          this.disabled = true;
          fetch("/dumps/" + dumpId, { method: "DELETE" })
            .then(function (r) {
              if (!r.ok) throw new Error("Delete failed");
              return r.json();
            })
            .then(function () {
              removeDumpRows(dumpId);
            })
            .catch(function () {
              btn.disabled = false;
              window.alert("Failed to delete upload #" + dumpId + ".");
            });
        });
      }

      function updatePlotIdRange() {
        var rows = document.querySelectorAll(".dump-row");
        var startInput = document.getElementById("plot-start-id");
        var endInput = document.getElementById("plot-end-id");
        var deleteInput = document.getElementById("delete-up-to-id");
        if (!rows.length) {
          startInput.value = "";
          endInput.value = "";
          deleteInput.value = "";
          return;
        }
        var ids = Array.prototype.map.call(rows, function (row) {
          return Number(row.id.replace("dump-row-", ""));
        });
        var minId = Math.min.apply(null, ids);
        var maxId = Math.max.apply(null, ids);
        startInput.value = minId;
        endInput.value = maxId;
        if (!deleteInput.value || Number(deleteInput.value) > maxId) {
          deleteInput.value = maxId;
        }
      }

      async function deleteUploadRange() {
        var upToId = Number(document.getElementById("delete-up-to-id").value);
        var status = document.getElementById("cleanup-status");
        if (!Number.isInteger(upToId) || upToId < 1) {
          status.textContent = "Enter a valid upload ID.";
          return;
        }
        var rows = document.querySelectorAll(".dump-row");
        var matching = Array.prototype.filter.call(rows, function (row) {
          return Number(row.id.replace("dump-row-", "")) <= upToId;
        });
        if (!matching.length) {
          status.textContent = "No uploads found with ID up to " + upToId + ".";
          return;
        }
        if (!window.confirm("Delete " + matching.length + " upload(s) with ID up to " + upToId + "? This cannot be undone.")) {
          return;
        }
        status.textContent = "Deleting uploads...";
        try {
          var response = await fetch("/dumps?up_to_id=" + upToId, { method: "DELETE" });
          if (!response.ok) throw new Error("Delete failed");
          var result = await response.json();
          matching.forEach(function (row) {
            removeDumpRows(row.id.replace("dump-row-", ""));
          });
          status.textContent = "Deleted " + result.deleted_count + " upload(s).";
        } catch (error) {
          status.textContent = "Failed to delete uploads: " + error.message;
        }
      }

      function attachPreview(btn) {
        btn.addEventListener("click", function () {
          var dumpId = this.dataset.dumpId;
          var previewRow = document.getElementById("preview-row-" + dumpId);
          var contentEl = document.getElementById("preview-content-" + dumpId);
          var isVisible = previewRow.classList.contains("visible");
          if (isVisible) {
            previewRow.classList.remove("visible");
            this.textContent = "Preview";
          } else {
            if (contentEl.dataset.loaded) {
              previewRow.classList.add("visible");
              this.textContent = "Hide";
              return;
            }
            previewRow.classList.add("visible");
            this.textContent = "Hide";
            fetch("/dumps/" + dumpId + "/preview")
              .then(function (r) {
                if (!r.ok) throw new Error("Failed to load");
                return r.json();
              })
              .then(function (data) {
                contentEl.textContent = JSON.stringify(data, null, 2);
                contentEl.dataset.loaded = "1";
              })
              .catch(function () {
                contentEl.textContent = "Failed to load preview.";
              });
          }
        });
      }


      function plotReadings(readings, hoveredTime) {
        window.lastPlotReadings = readings;
        var canvas = document.getElementById("readings-plot");
        var telemetryEl = document.getElementById("plot-telemetry");
        var width = canvas.clientWidth || 900;
        
        var hasBattery = readings.some(function (r) { return r.battery_v != null; });
        var hasBatteryPct = readings.some(function (r) { return r.battery_pct_est != null; });
        var numPanels = 2 + (hasBattery ? 1 : 0) + (hasBatteryPct ? 1 : 0);
        
        var panelH = 150;
        var gap = 46;
        var left = 75;
        var right = 25;
        var top = 35;
        var bottom = 48;
        var height = top + numPanels * panelH + (numPanels - 1) * gap + bottom;
        var scale = window.devicePixelRatio || 1;

        canvas.width = width * scale;
        canvas.height = height * scale;
        canvas.style.height = height + "px";

        var ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.clearRect(0, 0, width, height);

        var plotWidth = width - left - right;
        var minTime = readings[0].time;
        var maxTime = readings[readings.length - 1].time;
        if (minTime === maxTime) maxTime = minTime + 3600000;

        var cumulative = 0;
        readings.forEach(function (r, idx) {
          cumulative += r.pulses / r.impulsesPerKwh;
          r.cumulativeKwh = cumulative;

          var dtSeconds = 300;
          if (r.periodStart && r.time > r.periodStart) {
            dtSeconds = (r.time - r.periodStart) / 1000;
          } else if (idx > 0) {
            dtSeconds = (r.time - readings[idx - 1].time) / 1000;
          }
          if (dtSeconds <= 0) dtSeconds = 300;
          r.powerKw = (r.pulses / r.impulsesPerKwh) / (dtSeconds / 3600);
          r.powerW = r.powerKw * 1000;
        });

        var maxPulses = Math.max(1, Math.max.apply(null, readings.map(function (r) { return r.pulses; })));
        var maxKwh = Math.max(0.001, cumulative);

        function x(t) { return left + (t - minTime) / (maxTime - minTime) * plotWidth; }
        function y(val, panelTop, minVal, maxVal) {
          var range = maxVal - minVal;
          if (range <= 0) range = 1;
          return panelTop + panelH - (val - minVal) / range * panelH;
        }

        // Draw vertical gridlines & X-axis time labels
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        ctx.fillStyle = "#64748b";
        ctx.font = "10px ui-monospace, SFMono-Regular, monospace";
        ctx.textAlign = "center";

        var tickCount = Math.max(3, Math.min(8, Math.floor(plotWidth / 110)));
        for (var i = 0; i < tickCount; i++) {
          var tFraction = i / (tickCount - 1);
          var tickTime = minTime + tFraction * (maxTime - minTime);
          var px = x(tickTime);

          ctx.beginPath();
          ctx.moveTo(px, top - 10);
          ctx.lineTo(px, height - bottom + 5);
          ctx.stroke();

          var dateObj = new Date(tickTime);
          var timeStr = dateObj.toISOString().slice(11, 19);
          var dateStr = dateObj.toISOString().slice(5, 10);
          ctx.fillText(timeStr, px, height - bottom + 18);
          ctx.fillText(dateStr, px, height - bottom + 30);
        }
        ctx.setLineDash([]);

        // Helper to draw an engineering panel
        function drawPanel(panelTop, minVal, maxVal, title, unit, color, points, valueFn, formatFn) {
          // Panel Background
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(left, panelTop, plotWidth, panelH);
          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 1;
          ctx.strokeRect(left, panelTop, plotWidth, panelH);

          // Horizontal gridlines & Y-axis ticks (4 divisions)
          var divCount = 4;
          ctx.font = "10px ui-monospace, SFMono-Regular, monospace";
          ctx.textAlign = "right";
          for (var d = 0; d <= divCount; d++) {
            var ratio = d / divCount;
            var val = minVal + ratio * (maxVal - minVal);
            var py = panelTop + panelH - ratio * panelH;

            ctx.strokeStyle = "#f1f5f9";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(left, py);
            ctx.lineTo(left + plotWidth, py);
            ctx.stroke();

            ctx.fillStyle = "#475569";
            var labelText = formatFn ? formatFn(val) : val.toFixed(maxVal < 10 ? 2 : 0);
            ctx.fillText(labelText, left - 8, py + 3);
          }

          // Header badge
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(left, panelTop - 22, 170, 20);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "bold 11px system-ui, sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(title + " [" + unit + "]", left + 8, panelTop - 8);

          // Quick panel stats
          if (points.length) {
            var vals = points.map(valueFn);
            var minV = Math.min.apply(null, vals);
            var maxV = Math.max.apply(null, vals);
            var avgV = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
            ctx.fillStyle = "#64748b";
            ctx.font = "10px ui-monospace, SFMono-Regular, monospace";
            ctx.textAlign = "right";
            ctx.fillText(
              "Min: " + (formatFn ? formatFn(minV) : minV.toFixed(1)) +
              "  Max: " + (formatFn ? formatFn(maxV) : maxV.toFixed(1)) +
              "  Avg: " + (formatFn ? formatFn(avgV) : avgV.toFixed(1)),
              left + plotWidth, panelTop - 8
            );
          }

          if (!points.length) return;

          // Gradient fill under curve
          var grad = ctx.createLinearGradient(0, panelTop, 0, panelTop + panelH);
          grad.addColorStop(0, color + "33");
          grad.addColorStop(1, color + "00");

          ctx.beginPath();
          points.forEach(function (r, idx) {
            var px = x(r.time);
            var py = y(valueFn(r), panelTop, minVal, maxVal);
            if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          });
          var lastPx = x(points[points.length - 1].time);
          var firstPx = x(points[0].time);
          ctx.lineTo(lastPx, panelTop + panelH);
          ctx.lineTo(firstPx, panelTop + panelH);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();

          // Series line
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          points.forEach(function (r, idx) {
            var px = x(r.time);
            var py = y(valueFn(r), panelTop, minVal, maxVal);
            if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          });
          ctx.stroke();

          // Data point markers
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          points.forEach(function (r) {
            var px = x(r.time);
            var py = y(valueFn(r), panelTop, minVal, maxVal);
            ctx.beginPath();
            ctx.arc(px, py, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        }

        var panelIdx = 0;
        function nextTop() { return top + panelIdx++ * (panelH + gap); }

        var panelTops = [];

        // 1. Pulses / Period Panel
        var top0 = nextTop();
        panelTops.push({ top: top0, min: 0, max: Math.ceil(maxPulses * 1.1), fn: function (r) { return r.pulses; }, color: "#0284c7" });
        drawPanel(top0, 0, Math.ceil(maxPulses * 1.1), "PULSES / PERIOD", "cnt", "#0284c7", readings, function (r) { return r.pulses; });

        // 2. Cumulative Energy Panel
        var top1 = nextTop();
        panelTops.push({ top: top1, min: 0, max: maxKwh * 1.08, fn: function (r) { return r.cumulativeKwh; }, color: "#16a34a" });
        drawPanel(top1, 0, maxKwh * 1.08, "CUMULATIVE ENERGY", "kWh", "#16a34a", readings, function (r) { return r.cumulativeKwh; }, function (v) { return v.toFixed(3); });

        // 3. Battery Voltage Panel
        if (hasBattery) {
          var withV = readings.filter(function (r) { return r.battery_v != null; });
          var maxV = Math.max.apply(null, withV.map(function (r) { return r.battery_v; }));
          var minV = Math.min.apply(null, withV.map(function (r) { return r.battery_v; }));
          var vMinBound = Math.max(0, Math.floor((minV - 0.1) * 10) / 10);
          var vMaxBound = Math.ceil((maxV + 0.1) * 10) / 10;
          if (vMinBound >= vMaxBound) vMaxBound = vMinBound + 0.5;

          var top2 = nextTop();
          panelTops.push({ top: top2, min: vMinBound, max: vMaxBound, fn: function (r) { return r.battery_v; }, color: "#ea580c" });
          drawPanel(top2, vMinBound, vMaxBound, "BATTERY VOLTAGE", "V", "#ea580c", withV, function (r) { return r.battery_v; }, function (v) { return v.toFixed(2); });
        }

        // 4. Battery Capacity Panel
        if (hasBatteryPct) {
          var withPct = readings.filter(function (r) { return r.battery_pct_est != null; });
          var top3 = nextTop();
          panelTops.push({ top: top3, min: 0, max: 100, fn: function (r) { return r.battery_pct_est; }, color: "#9333ea" });
          drawPanel(top3, 0, 100, "BATTERY CAPACITY", "%", "#9333ea", withPct, function (r) { return r.battery_pct_est; }, function (v) { return v.toFixed(0) + "%"; });
        }

        // Hover Crosshair & Telemetry Banner update
        var closest = null;
        if (hoveredTime != null && readings.length) {
          var minDiff = Infinity;
          readings.forEach(function (r) {
            var diff = Math.abs(r.time - hoveredTime);
            if (diff < minDiff) {
              minDiff = diff;
              closest = r;
            }
          });
        }

        if (closest) {
          telemetryEl.style.display = "flex";
          document.getElementById("telemetry-time").textContent = new Date(closest.time).toISOString().replace("T", " ").slice(0, 19) + " UTC";
          document.getElementById("telemetry-pulses").textContent = closest.pulses + " cnt";
          document.getElementById("telemetry-power").textContent = Number.isFinite(closest.powerW) ? closest.powerW.toFixed(1) + " W (" + closest.powerKw.toFixed(3) + " kW)" : "n/a";
          document.getElementById("telemetry-kwh").textContent = closest.cumulativeKwh.toFixed(3) + " kWh";
          document.getElementById("telemetry-batt").textContent = closest.battery_v != null ? closest.battery_v.toFixed(2) + " V" + (closest.battery_pct_est != null ? " (" + closest.battery_pct_est + "%)" : "") : "n/a";

          var cx = x(closest.time);

          // Draw vertical crosshair line across all panels
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = "#0284c7";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(cx, top - 10);
          ctx.lineTo(cx, height - bottom + 5);
          ctx.stroke();
          ctx.setLineDash([]);

          // Draw target highlights on each panel
          panelTops.forEach(function (p) {
            var val = p.fn(closest);
            if (val != null) {
              var cy = y(val, p.top, p.min, p.max);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(cx, cy, 6, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(cx, cy, 3, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }
      }

      async function plotUploadRange() {
        var start = Number(document.getElementById("plot-start-id").value);
        var end = Number(document.getElementById("plot-end-id").value);
        var status = document.getElementById("plot-status");
        if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start) {
          status.textContent = "Enter a valid inclusive ID range.";
          return;
        }
        if (end - start > 1000) {
          status.textContent = "Please select at most 1000 upload IDs at a time.";
          return;
        }
        status.textContent = "Loading uploads...";
        try {
          var responses = await Promise.all(Array.from({ length: end - start + 1 }, function (_, i) {
            return fetch("/dumps/" + (start + i) + ".json");
          }));
          var uploads = [];
          for (var i = 0; i < responses.length; i++) {
            if (responses[i].ok) uploads.push(await responses[i].json());
          }
          var readings = [];
          uploads.forEach(function (upload) {
            var impulses = Number(upload.meter_impulses_per_kwh);
            (upload.readings || []).forEach(function (reading) {
              readings.push({
                time: Date.parse(reading.timestamp),
                periodStart: reading.period_start ? Date.parse(reading.period_start) : null,
                pulses: Number(reading.pulses),
                impulsesPerKwh: impulses,
                battery_v: reading.battery_v !== undefined ? reading.battery_v : null,
                battery_pct_est: reading.battery_pct_est !== undefined ? reading.battery_pct_est : null
              });
            });
          });
          readings = readings.filter(function (r) {
            return Number.isFinite(r.time) && Number.isFinite(r.pulses) && r.impulsesPerKwh > 0;
          }).sort(function (a, b) { return a.time - b.time; });
          if (!readings.length) {
            status.textContent = "No readings found in that range.";
            return;
          }
          plotReadings(readings);
          status.textContent = "Plotted " + readings.length + " readings from " + uploads.length + " uploads.";
        } catch (error) {
          status.textContent = "Failed to load uploads: " + error.message;
        }
      }

      // Mouse & touch interaction for plot canvas
      var plotCanvas = document.getElementById("readings-plot");
      function handlePlotHover(e) {
        if (!window.lastPlotReadings || !window.lastPlotReadings.length) return;
        var rect = plotCanvas.getBoundingClientRect();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var mouseX = clientX - rect.left;
        var left = 75;
        var right = 25;
        var plotW = rect.width - left - right;
        if (mouseX < left || mouseX > rect.width - right) {
          plotReadings(window.lastPlotReadings, null);
          return;
        }
        var minTime = window.lastPlotReadings[0].time;
        var maxTime = window.lastPlotReadings[window.lastPlotReadings.length - 1].time;
        var hoveredTime = minTime + (mouseX - left) / plotW * (maxTime - minTime);
        plotReadings(window.lastPlotReadings, hoveredTime);
      }

      plotCanvas.addEventListener("mousemove", handlePlotHover);
      plotCanvas.addEventListener("touchmove", handlePlotHover);
      plotCanvas.addEventListener("mouseleave", function () {
        if (window.lastPlotReadings) plotReadings(window.lastPlotReadings, null);
      });

      document.getElementById("plot-button").addEventListener("click", plotUploadRange);
      document.getElementById("delete-bulk-button").addEventListener("click", deleteUploadRange);
      window.addEventListener("resize", function () {
        if (window.lastPlotReadings) plotReadings(window.lastPlotReadings);
      });

      function connectWs() {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var ws = new WebSocket(proto + "//" + location.host + "/ws");
        ws.onmessage = function (event) {
          var msg = JSON.parse(event.data);
          if (msg.type === "new_dump") {
            addDumpRow(msg.dump, true);
          }
        };
        ws.onclose = function () {
          setTimeout(connectWs, 2000);
        };
      }

      // Load initial dumps
      var initialDumps = {{ dumps | tojson | safe }};
      for (var i = initialDumps.length - 1; i >= 0; i--) {
        addDumpRow(initialDumps[i], false);
      }

      if (initialDumps.length) {
        document.getElementById("delete-up-to-id").value = Math.max.apply(null, initialDumps.map(function (dump) { return dump.id; }));
        updatePlotIdRange();
      }

      connectWs();
    </script>
  </body>
</html>
