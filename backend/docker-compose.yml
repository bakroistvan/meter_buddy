services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - METER_BUDDY_AUTH_USER=meter-buddy
      - METER_BUDDY_AUTH_PASSWORD=change-me
      - METER_BUDDY_DB_PATH=/data/meter_buddy.sqlite3
    volumes:
      - backend_data:/data

volumes:
  backend_data:
