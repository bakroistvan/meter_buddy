# Environment: copy .env.example → .env and edit (Compose loads .env automatically).
#   cp .env.example .env
#
# Host: only HTTPS on METER_BUDDY_HTTPS_PORT (default 9111).
# Router: port-forward WAN TCP 9111 → this host:9111.
# ACME: DuckDNS DNS-01 (DUCKDNS_TOKEN) — port 80 not required.

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      # Caddy https_port is 9111 in-container (see Caddyfile); keep host port configurable.
      - "${METER_BUDDY_HTTPS_PORT:-9111}:9111"
    env_file:
      - .env
    volumes:
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - meter_buddy
    depends_on:
      - backend
    restart: unless-stopped

  # Named volumes are often root-owned; backend runs as uid 10001 (read_only rootfs).
  backend-perms:
    image: alpine:3.20
    user: root
    volumes:
      - backend_data:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - backend_data:/data
    networks:
      - meter_buddy
    depends_on:
      backend-perms:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  meter_buddy:
    driver: bridge

volumes:
  backend_data:
  caddy_data:
  caddy_config:
