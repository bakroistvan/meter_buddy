# Environment: copy .env.example → .env and edit (Compose loads .env automatically).
#   cp .env.example .env
#
# Host: only HTTPS on METER_BUDDY_HTTPS_PORT (default 9111).
# Router: port-forward WAN TCP 9111 → this host:9111.
# ACME: DuckDNS DNS-01 (DUCKDNS_TOKEN) — port 80 not required.

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "${METER_BUDDY_HTTPS_PORT:-9111}:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - meter_buddy
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - backend_data:/data
    networks:
      - meter_buddy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  meter_buddy:
    driver: bridge

volumes:
  backend_data:
  caddy_data:
  caddy_config:
