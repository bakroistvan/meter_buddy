name: Build firmware

on:
  push:
    paths:
      - 'platformio.ini'
      - 'partitions.csv'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/build-firmware.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'platformio.ini'
      - 'partitions.csv'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/build-firmware.yml'
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed for `git describe` on non-tag builds.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (installed files), pip cache, and user site-packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.local
            ~/.cache/pip
          # include Python version and platformio.ini hash so cache is specific to env and config
          key: ${{ runner.os }}-platformio-3.11-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-3.11-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip && pip install platformio

      - name: Build firmware
        run: pio run

      - name: Resolve firmware version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved firmware version: ${VERSION}"

      - name: Package versioned firmware artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ENV_DIR=".pio/build/seeed_xiao_esp32c3"
          OUT_DIR="dist"
          PREFIX="meter-buddy-fw-${VERSION}"

          mkdir -p "${OUT_DIR}"
          cp "${ENV_DIR}/firmware.bin" "${OUT_DIR}/${PREFIX}.bin"
          cp "${ENV_DIR}/firmware.elf" "${OUT_DIR}/${PREFIX}.elf"
          cp "${ENV_DIR}/partitions.bin" "${OUT_DIR}/${PREFIX}-partitions.bin"
          ls -la "${OUT_DIR}"

      - name: Smoke-check versioned artifact filenames
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUT_DIR="dist"
          shopt -s nullglob
          files=("${OUT_DIR}"/meter-buddy-fw-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No versioned artifacts found in ${OUT_DIR}"
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "${f}")"
            if [[ "${base}" != *"${VERSION}"* ]]; then
              echo "Artifact filename missing version '${VERSION}': ${base}"
              exit 1
            fi
            echo "OK: ${base}"
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: dist/*

      - name: Create Release and upload firmware assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
