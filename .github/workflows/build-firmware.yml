---
name: Build firmware

on:
  push:
    paths:
      - 'platformio.ini'
      - 'partitions.csv'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/build-firmware.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'platformio.ini'
      - 'partitions.csv'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/build-firmware.yml'
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO (installed files), pip cache, and user site-packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.local
            ~/.cache/pip
          # include Python version and platformio.ini hash so cache is specific to env and config
          key: ${{ runner.os }}-platformio-3.11-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-3.11-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip && pip install platformio

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.elf
            .pio/build/**/partitions.bin

      - name: Create Release and upload firmware assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.elf
            .pio/build/**/partitions.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
